name: Probe Spot Endpoints

on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/workflows/probe-spot.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          for path in \
            "/map/api/spot/667607?culture=ja" \
            "/map/api/spots/667607?culture=ja" \
            "/map/spot/667607" \
            "/api/spot/667607" \
            "/portal/spot/edit/667607" ; do
            echo "=== $path"
            curl -sS -o body.txt -w "status=%{http_code} redirect=%{redirect_url} type=%{content_type}\n" \
              -H "User-Agent: Mozilla/5.0" -H "Referer: https://platinumaps.jp/" "https://platinumaps.jp$path" || true
            head -c 600 body.txt | tr '\n' ' '; echo
          done
